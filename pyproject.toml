# m00nny_utils packaging (U1 core / U0 native split, 2026-10-30; flat layout 2026-11-13).
# The repository is the project and the package is the m00nny_utils/ directory in it, so a checkout
# imports from the repository root without installing. Subpackages are carried by the "**/*.py" data
# glob, never listed; the native sources (csrc/, CMakeLists.txt) live inside the package because it
# builds them at import time.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "m00nny-utils"
version = "1.0.0"
description = "Personal ML utilities: a stdlib-only core (system, util) with optional torch, media, dataset and native (C++/CUDA) parts."
readme = "readme.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Import-time native build (U0): everything __bootstrap__ imports, directly or through install/
# (torch, requests), plus gcc, g++, cmake and a CUDA torch on the machine. Without it, set
# LIBM00NNY_SKIP_NATIVE=1 to use the core alone.
native = ["torch", "requests"]
torch = ["torch"]
media = ["torch", "numpy", "ffmpeg-python", "requests"]
# datasets/ reaches util's media modules, and dataset_utils imports six inside a function.
datasets = ["m00nny-utils[media]", "torchvision", "pillow", "psutil", "tqdm", "opencv-python", "six"]
all = ["m00nny-utils[native,torch,media,datasets]"]
# Torch backend. By default torch and torchvision come from PyPI, whose Linux wheels are CUDA builds
# (torch 2.15.0 requires cuda-toolkit 13.2) and whose macOS arm64 wheels carry MPS: CUDA and MPS take
# no extra, and the CUDA version follows torch's own as torch is upgraded. Only backends PyPI does not
# ship are declared, at most one per install (see [tool.uv] conflicts):
#   cpu    CPU-only torch on Linux
#   rocm   AMD ROCm torch; its index path names the ROCm release, the one value to bump by hand
cpu = ["torch", "torchvision"]
rocm = ["torch", "torchvision", "triton-rocm; sys_platform == 'linux'"]

[tool.setuptools]
packages = ["m00nny_utils"]
include-package-data = false

[tool.setuptools.package-data]
# Python sources of every subpackage, and the sources the import-time native build compiles.
"m00nny_utils" = ["**/*.py", "**/*.pyi", "py.typed", "CMakeLists.txt",
                  "csrc/**/*.h", "csrc/**/*.hpp", "csrc/**/*.cuh", "csrc/**/*.cpp", "csrc/**/*.cu"]

[tool.setuptools.exclude-package-data]
"m00nny_utils" = ["CMakeFiles/**", "build/**", "dist/**", "release/**", "debug/**", "objdir*/**", "**/__pycache__/**", ".venv/**"]

# ---- install ----------------------------------------------------------------------------------
#   uv sync --extra native                Linux + NVIDIA: PyPI CUDA torch, with the import-time native build
#   uv sync --extra torch                 macOS: PyPI torch with MPS (import with LIBM00NNY_SKIP_NATIVE=1)
#   uv sync --extra rocm --extra torch    Linux + AMD (import with LIBM00NNY_SKIP_NATIVE=1)
#   uv sync --extra cpu --extra torch     Linux, CPU only (import with LIBM00NNY_SKIP_NATIVE=1)
# add --extra media / --extra datasets as needed.
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "rocm" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-rocm", extra = "rocm" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-rocm", extra = "rocm" },
]
# torch's ROCm wheels depend on triton-rocm, which only the ROCm index carries (not PyPI).
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
